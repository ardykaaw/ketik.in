<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Karakter AI (Pollinations + Mix Blend Mode)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f1f5f9; /* Latar belakang abu-abu terang kebiruan ala infografis */
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 600px;
            margin-bottom: 30px;
            text-align: center;
        }
        input {
            width: 80%;
            padding: 12px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 15px;
        }
        button {
            padding: 12px 24px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #2563eb; }
        
        /* INI ADALAH AREA KANVAS INFOGRAFIS (TIRUAN) */
        .infographic-canvas {
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%); /* Warna latar pastel */
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            position: relative;
            overflow: hidden;
            border: 4px solid #fff;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold;
            color: #475569;
            display: none;
        }

        /* TRIK MAGIC: MIX-BLEND-MODE */
        #character-img {
            max-width: 100%;
            max-height: 90%;
            object-fit: contain;
            
            /* Trik menghilangkan background putih */
            mix-blend-mode: multiply; 
            
            /* Sedikit menaikkan kontras agar warna tidak terlalu pudar akibat multiply */
            filter: contrast(1.1) saturate(1.1);
            
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Uji Coba Karakter AI On-the-Fly</h2>
        <p style="color: #64748b; margin-bottom: 20px; font-size: 14px;">
            Sistem ini menggunakan Pollinations AI (Gratis) dan CSS Mix-Blend-Mode untuk menghapus latar putih secara otomatis.
        </p>
        
        <input type="text" id="prompt-input" value="A young Indonesian male teacher wearing batik, holding a laptop, smiling" placeholder="Masukkan instruksi karakter (Bahasa Inggris lebih baik)">
        <br>
        <button onclick="generateCharacter()">Generate Karakter</button>
    </div>

    <!-- Area simulasi latar belakang infografis -->
    <div class="infographic-canvas">
        <div class="loading" id="loading-text">Sedang menggambar... (5-10 detik)</div>
        <img id="character-img" alt="Karakter AI" crossorigin="anonymous">
    </div>

    <script>
        function generateCharacter() {
            const inputPrompt = document.getElementById('prompt-input').value;
            if (!inputPrompt) return;

            const imgEl = document.getElementById('character-img');
            const loadingText = document.getElementById('loading-text');

            // Sembunyikan gambar lama, tampilkan loading
            imgEl.style.display = 'none';
            loadingText.style.display = 'block';

            // Tambahkan instruksi paksaan agar AI membuat gambar terisolasi di latar putih jernih
            // Ini SANGAT PENTING agar trik CSS mix-blend-mode: multiply bisa bekerja sempurna.
            const fullPrompt = `${inputPrompt}, realistic 2D digital illustration, isolated on pure white background, flat even lighting, clean edges, no shadows on background`;
            
            // Format URL Pollinations (nologo=true untuk menghilangkan watermark, enhance=false agar prompt tidak diubah)
            const encodedPrompt = encodeURIComponent(fullPrompt);
            const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=512&height=512&nologo=true&enhance=false`;

            // Bebankan gambar baru
            imgEl.src = imageUrl;

            // Saat gambar selesai dimuat
            imgEl.onload = function() {
                loadingText.style.display = 'none';
                imgEl.style.display = 'block';
            };

            // Jika error
            imgEl.onerror = function() {
                loadingText.textContent = "Gagal memuat gambar. Coba lagi.";
            };
        }
    </script>
</body>
</html>
