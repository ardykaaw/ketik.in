[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:quillio-queue-worker-high]
process_name=%(program_name)s_%(process_num)02d
command=php /app/artisan queue:work database --queue=high --sleep=3 --tries=3 --timeout=600
autostart=true
autorestart=true
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/quillio-queue-high.log
stopwaitsecs=3600

[program:quillio-queue-worker-default]
process_name=%(program_name)s_%(process_num)02d
command=php /app/artisan queue:work database --queue=default --sleep=3 --tries=3 --timeout=600
autostart=true
autorestart=true
numprocs=3
redirect_stderr=true
stdout_logfile=/var/log/quillio-queue-default.log
stopwaitsecs=3600
